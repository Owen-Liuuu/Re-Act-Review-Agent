# Example configuration for ReAct-Review.
# Copy this to config.yaml and adjust. Keep API keys OUT of version control
# (config.yaml is git-ignored); prefer environment variables in real runs.

app_name: react-review
environment: development          # development | staging | production
mock_mode: true                   # true = mock implementations (no network/LLM)

enabled_steps:
  - search_validation
  - paper_verification
  - data_extraction
  - table_comparison

# Primary LLM backend. provider: mock | openai | anthropic | gemini | qwen
llm:
  provider: mock
  model: gpt-4o
  temperature: 0.1
  max_tokens: 16384
  api_key: ""                     # leave empty for mock; set via env in real runs
  base_url: ""
  max_concurrency: 8              # measured group cap; per-backend asyncio.Semaphore
  max_retries: 5                  # HTTP 429 / transient-network retry attempts
  retry_base_delay: 2.0           # exponential backoff base (seconds)

# Optional second LLM for dual-model cross-validation (Step 3).
# Remove this block or set provider: mock to run single-model.
llm2:
  provider: mock
  model: gpt-4o
  temperature: 0.1
  max_tokens: 4096
  api_key: ""
  max_concurrency: 3

# Optional vision backend for raster figures (forest plots, etc.).
# Separate from llm2 — that slot is the cross-check judge.
# Model name is config-only; the adapter is not pinned to a GLM SKU.
vision:
  provider: glm
  model: glm-4.6v-flash      # free tier; may 429 (code 1305)
  base_url: "https://open.bigmodel.cn/api/paas/v4"
  api_key: ""
  temperature: 0.1
  max_retries: 8             # free-tier congestion is common; back off longer

pubmed:
  api_key: ""                     # NCBI E-utilities key (optional; raises rate limit)
  base_url: "https://eutils.ncbi.nlm.nih.gov/entrez/eutils"
  rate_limit: 3.0
  email: ""                       # recommended by NCBI; also used for Unpaywall

unpaywall:
  email: ""                       # required by Unpaywall TOS for real runs
  enabled: true

crossref:
  base_url: "https://api.crossref.org"
  mailto: ""                      # email to join CrossRef's polite pool (faster)
  timeout: 30.0

thresholds:
  title_similarity: 0.85
  author_match_ratio: 0.8

# Transcription gear: copy the same api_key as `llm`.
#
# A step listed under `routing` runs on this gear, which sends
# `thinking: {type: disabled}`. A step NOT listed runs on `llm`, where no
# reasoning key is sent at all and DeepSeek therefore reasons by default —
# the model name alone does not turn it off, only a profile can.
#
# Measured on doc05 (2026-09-08, run flash-routed): moving extraction here
# left accuracy unchanged (20/56 -> 16/47 compared, both ~35%) while calls
# fell from 6062s to 244s and failures from 13% to 2%.
#
# evidence_localize stays OFF this gear. It decides which figures are on the
# evidence chain, which is judgement, not transcription: without reasoning it
# found none of the four forest plots and the claim set collapsed from 56 to
# 12. forest_ocr_vision stays off it too — this gear has no vision.
backend_profiles:
  transcribe:
    provider: openai
    model: deepseek-v4-flash
    base_url: "https://api.deepseek.com"
    api_key: ""                   # same key as llm
    reasoning: off
    max_tokens: 8192              # explicit transport cap; do not inherit implicitly

routing:
  table_capture:      transcribe
  forest_ocr_text:    transcribe
  claim_origin:       transcribe
  unpivot:            transcribe
  references:         transcribe
  source_row_map:     transcribe
  review_lens:        transcribe
  field_resolution:   transcribe
  extract_locate:     transcribe
  extract_transcribe: transcribe
  # Deliberately absent:
  #   evidence_localize — judgement; without reasoning it found none of the
  #                       four forest plots (56 claims -> 12).
  #   forest_ocr_vision — this gear has no vision.
  #   semantic_compare  — no evidence either way: it was never called in the
  #                       run that cleared the others, so it stays on `llm`.
  #                       The local config used for the September 2026
  #                       evaluation runs routed it to transcribe too;
  #                       neither choice has a controlled comparison.

paths:
  data_dir: ./data
  output_dir: ./output
  log_file: ./logs/react_review.log
